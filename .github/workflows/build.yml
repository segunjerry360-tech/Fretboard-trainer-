name: Build Fretboard Trainer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: |
          test -f index.html
          test -f icon.png
          mkdir -p www assets
          cp index.html www/index.html
          cp icon.png assets/icon.png

      - name: Add Android platform
        run: npx cap add android

      - name: Remove default Capacitor launcher icons
        run: rm -rf android/app/src/main/res/mipmap-*

      - name: Generate custom Android launcher icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#171a22' --iconBackgroundColorDark '#171a22'

      - name: Verify custom launcher icons were generated
        run: |
          echo 'Generated launcher icon files:'
          find android/app/src/main/res -type f -path '*/mipmap-*/*' -print
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fretboard-Trainer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
